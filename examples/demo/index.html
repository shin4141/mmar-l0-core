<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MMAR Demo</title>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; margin: 0; }
    .wrap { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; padding: 12px; height: 100vh; box-sizing: border-box; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; min-height: 0; }
    .muted { color: #666; font-size: 12px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    button { border: 1px solid #ccc; background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    button.active { border-color: #111; font-weight: 700; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; overflow: auto; flex: 1; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .pill { border: 1px solid #ddd; border-radius: 999px; padding: 2px 8px; font-size: 12px; }
    textarea { width: 100%; min-height: 120px; resize: vertical; }
    a { color: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Left -->
    <div class="card">
      <div class="row">
        <div class="pill">MMAR demo</div>
        <div id="ts" class="muted"></div>
      </div>
      <p class="muted" style="margin:10px 0 6px;">
        Input (static demo). Output files are loaded from this folder.
      </p>
      <textarea id="q" placeholder="Question (for display only)"></textarea>
      <div class="row" style="margin-top:10px;">
        <button id="reload">Reload files</button>
        <span class="muted">Tip: default view is Compare.</span>
      </div>
      <p class="muted" style="margin-top:10px;">
        Files expected:
        <br>out_compare.txt / out_expand.txt / out_diff.txt / out_merge.txt
      </p>
    </div>

    <!-- Right -->
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <pre id="out">Loading…</pre>
      <div class="muted" style="margin-top:8px;">
        If content doesn't load, open via a local server (see instructions below).
      </div>
    </div>
  </div>

<script>
  const TAB_SPEC = [
    { key: "compare", label: "Compare", file: "out_compare.txt" },
    { key: "expand",  label: "Expand",  file: "out_expand.txt"  },
    { key: "diff",    label: "Diff",    file: "out_diff.txt"    },
    { key: "merge",   label: "Merge",   file: "out_merge.txt"   },
  ];

  const tabsEl = document.getElementById("tabs");
  const outEl  = document.getElementById("out");
  const qEl    = document.getElementById("q");
  const tsEl   = document.getElementById("ts");

  let active = "compare";

  function setTimestamp() {
    const d = new Date();
    tsEl.textContent = d.toISOString();
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    for (const t of TAB_SPEC) {
      const b = document.createElement("button");
      b.textContent = t.label;
      b.className = (t.key === active) ? "active" : "";
      b.onclick = () => { active = t.key; renderTabs(); loadActive(); };
      tabsEl.appendChild(b);
    }
  }

  async function fetchText(file) {
    // cache-bust to ensure reload works
    const url = `${file}?_=${Date.now()}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${file}: HTTP ${r.status}`);
    return await r.text();
  }

  async function loadActive() {
    const spec = TAB_SPEC.find(x => x.key === active);
    outEl.textContent = "Loading…";
    try {
      const txt = await fetchText(spec.file);
      outEl.textContent = txt.trim() ? txt : "(empty)";
      setTimestamp();
      // auto-fill input textarea from Compare, if it contains === INPUT ===
      if (active === "compare") {
        const m = txt.match(/=== INPUT ===\s*([\s\S]*?)\n=== /);
        if (m && m[1]) qEl.value = m[1].trim();
      }
    } catch (e) {
      outEl.textContent =
`Failed to load ${spec.file}

${e}

Open this folder with a local server:
  cd examples/demo
  python3 -m http.server 8080
Then open:
  http://localhost:8080/
`;
    }
  }

  document.getElementById("reload").onclick = loadActive;

  // init
  renderTabs();
  loadActive();
</script>
</body>
</html>
