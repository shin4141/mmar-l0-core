<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MMAR Demo</title>
  <style>
    :root{
      --bg:#f6f7f9; --card:#ffffff; --text:#0F172A; --muted:#64748B;
      --line:#e6e8ee; --accent:rgba(56,189,248,.75); --accentSoft:rgba(56,189,248,.12);
      --shadow:0 10px 26px rgba(16,24,40,.08);
      --r:16px;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;
          color:var(--text); background:var(--bg); }
    .wrap{ display:grid; grid-template-columns: 1fr 2fr; gap:16px; padding:16px; height:100vh; }
    .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r);
           padding:14px; display:flex; flex-direction:column; min-height:0; box-shadow:var(--shadow); }
    .muted{ color:var(--muted); font-size:12px; }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .pill{ border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12px; background:#fff; }
    textarea{ width:100%; min-height:160px; resize:vertical; border:1px solid var(--line);
              border-radius:12px; padding:10px; font-size:14px; outline:none; }
    textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accentSoft); }
    textarea.big{ min-height:55vh; }

    .tabs{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    button{ border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 12px;
            cursor:pointer; font-weight:700; }
    button.active{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accentSoft); color:#0284C7; }
    pre{ margin:0; white-space:pre-wrap; word-break:break-word; overflow:auto; flex:1; font-size:13px; line-height:1.45; }
    .subpre{ margin:0; white-space:pre-wrap; word-break:break-word; overflow:auto; font-size:13px; line-height:1.45; }

    .counter{ margin-left:auto; font-size:12px; color:var(--muted); font-weight:700; }
    .counter.warn{ color:#c2410c; }

    details{ border:1px solid var(--line); border-radius:14px; padding:10px 12px; background:#fff; }
    summary{ cursor:pointer; font-weight:800; list-style:none; }
    summary::-webkit-details-marker{ display:none; }
    .sumRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .sumLeft{ min-width:0; }
    .pillBadge{
      font-size:11px; font-weight:800; color:#0369A1;
      border:1px solid rgba(56,189,248,.45); background:rgba(56,189,248,.12);
      border-radius:999px; padding:2px 8px; white-space:nowrap;
    }
    .small{ color:var(--muted); font-size:12px; margin-left:8px; font-weight:700; }
    .preview{ margin-top:8px; }
    .beforeBox{ box-shadow:0 1px 3px rgba(15,23,42,.04); }
    .afterBox{
      border:1px solid rgba(56,189,248,.35);
      box-shadow:0 12px 28px rgba(56,189,248,.18);
      animation:afterHero 1s ease-out 1;
    }
    .deltaBox{ background: rgba(56,189,248,.08); border:1px solid rgba(56,189,248,.25); }
    @keyframes afterHero{
      0%{ transform:translateY(3px); box-shadow:0 6px 14px rgba(56,189,248,.10); }
      100%{ transform:translateY(0); box-shadow:0 12px 28px rgba(56,189,248,.18); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <div class="pill">MMAR demo</div>
        <div id="ts" class="muted"></div>
      </div>
      <p class="muted" style="margin:10px 0 6px;">Input (static demo). Output files are loaded from this folder.</p>
      <textarea id="q" placeholder="Question (for display only)"></textarea>
      <div class="row" style="margin-top:10px;">
        <button id="mode-static" class="active">Static</button>
        <button id="mode-live">Live</button>
        <button id="run-live" disabled>Run</button>
        <span id="live-api-base" class="muted"></span>
        <span id="live-last-run" class="muted"></span>
        <span id="live-hint" class="muted"></span>
      </div>
      <div class="row" style="margin-top:10px;">
        <button id="reload">Reload files</button>
        <span class="muted">Default view is Compare.</span>
        <span id="counter" class="counter"></span>
      </div>
      <p class="muted" style="margin-top:10px;">
        Files expected:
        <br>out_compare.txt / out_expand.txt / out_diff.txt / out_merge.txt
      </p>
    </div>

    <div class="card">
      <div class="tabs" id="tabs"></div>
      <div id="out">Loading…</div>
      <div class="muted" style="margin-top:8px;">
        If content doesn't load on GitHub Pages immediately, wait a bit or hard-reload.
      </div>
    </div>
  </div>

<script>
  const API_BASE_DEFAULT = "";
  function getApiBase(){
    const q = new URLSearchParams(window.location.search).get("api");
    const raw = (q != null ? q : API_BASE_DEFAULT).trim();
    return raw.replace(/\/+$/, "");
  }
  const API_BASE = getApiBase();
  const TAB_SPEC = [
    { key: "compare", label: "Compare", file: "out_compare.txt" },
    { key: "expand",  label: "Expand",  file: "out_expand.txt"  },
    { key: "diff",    label: "Diff",    file: "out_diff.txt"    },
    { key: "merge",   label: "Merge",   file: "out_merge.txt"   },
  ];

  const tabsEl = document.getElementById("tabs");
  const outEl  = document.getElementById("out");
  const qEl    = document.getElementById("q");
  const tsEl   = document.getElementById("ts");
  const modeStaticEl = document.getElementById("mode-static");
  const modeLiveEl = document.getElementById("mode-live");
  const runLiveEl = document.getElementById("run-live");
  const liveApiBaseEl = document.getElementById("live-api-base");
  const liveLastRunEl = document.getElementById("live-last-run");
  const liveHintEl = document.getElementById("live-hint");
  const LIMIT = 600;
  const PREVIEW_LINES_MAIN = 7;
  const PREVIEW_LINES_DELTA = 3;
  const counterEl = document.getElementById("counter");
  let mode = "static";
  let liveData = null;
  let liveReady = false;

  function updateCounter(){
    const used = (qEl.value || "").length;
    const left = LIMIT - used;
    counterEl.textContent = `Remaining: ${left}`;
    counterEl.className = "counter" + (left < 0 ? " warn" : "");
  }
  qEl.addEventListener("input", updateCounter);
  qEl.addEventListener("focus", () => qEl.classList.add("big"));
  qEl.addEventListener("blur", () => qEl.classList.remove("big"));
  updateCounter();

  let active = "compare";
  function setTimestamp(){ tsEl.textContent = new Date().toISOString(); }

  function renderTabs(){
    tabsEl.innerHTML = "";
    for (const t of TAB_SPEC){
      const b = document.createElement("button");
      b.textContent = t.label;
      b.className = (t.key === active) ? "active" : "";
      b.onclick = () => { active = t.key; renderTabs(); loadActive(); };
      tabsEl.appendChild(b);
    }
  }

  function renderMode(){
    modeStaticEl.className = (mode === "static") ? "active" : "";
    modeLiveEl.className = (mode === "live") ? "active" : "";
    runLiveEl.disabled = (mode !== "live") || !liveReady;
    liveApiBaseEl.textContent = `API: ${API_BASE || "(none)"}`;
    if (!liveLastRunEl.textContent) liveLastRunEl.textContent = "Last run: -";
    if (!API_BASE && mode === "live" && !liveHintEl.textContent) {
      liveHintEl.textContent = "Live error: API base is empty";
    }
  }

  function withTimeout(ms){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return { signal: ctrl.signal, done: () => clearTimeout(t) };
  }

  async function checkLiveHealth(){
    liveReady = false;
    if (!API_BASE) {
      liveHintEl.textContent = "Live error: API base is empty";
      renderMode();
      return;
    }
    liveHintEl.textContent = "Checking live...";
    renderMode();
    const w = withTimeout(3000);
    try {
      const r = await fetch(`${API_BASE}/api/health`, { signal: w.signal });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const h = await r.json();
      if (!h || h.ok !== true) throw new Error("health not ok");
      liveReady = true;
      liveHintEl.textContent = "Live ready";
    } catch (e) {
      liveReady = false;
      const msg = (e && e.name === "AbortError") ? "timeout" : String(e);
      liveHintEl.textContent = `Live error: ${msg}`;
    } finally {
      w.done();
      renderMode();
    }
  }

  async function fetchText(file){
    const url = `${file}?_=${Date.now()}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${file}: HTTP ${r.status}`);
    return await r.text();
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function section(txt, head, nextHead){
    const re = new RegExp(`=== ${head} ===\\s*([\\s\\S]*?)(?=\\n=== ${nextHead} ===|$)`);
    const m = txt.match(re);
    return (m && m[1]) ? m[1].trim() : "";
  }

  function clipLines(text, maxLines){
    const raw = (text || "(empty)").replace(/\r\n/g, "\n");
    const lines = raw.split("\n");
    const clipped = lines.slice(0, maxLines).join("\n");
    const truncated = lines.length > maxLines;
    return {
      preview: truncated ? `${clipped}\n...` : clipped,
      total: lines.length,
      clippedTo: maxLines
    };
  }

  function detailsBlock(title, fullText, previewLines, extraClass="", badgeText=""){
    const info = clipLines(fullText, previewLines);
    const meta = `<span class="small">(${info.total} lines, preview ${info.clippedTo})</span>`;
    const badge = badgeText ? `<span class="pillBadge">${escapeHtml(badgeText)}</span>` : "";
    return `
      <details class="${extraClass}" open>
        <summary><span class="sumRow"><span class="sumLeft">${title} ${meta}</span>${badge}</span></summary>
        <div class="preview"><pre class="subpre">${escapeHtml(info.preview)}</pre></div>
      </details>
    `;
  }

  function renderCompare(txt){
    const input  = section(txt, "INPUT", "SINGLE \\(seed\\)");
    const before = section(txt, "SINGLE \\(seed\\)", "MMAR EXPAND \\(tab output\\)");
    const after  = section(txt, "MMAR EXPAND \\(tab output\\)", "DIFF \\(head\\)");
    const delta  = section(txt, "DIFF \\(head\\)", "$");
    if (input) qEl.value = input;
    updateCounter();

    outEl.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:12px;">
        ${detailsBlock("Before (Single)", before, PREVIEW_LINES_MAIN, "beforeBox")}
        ${detailsBlock("After (MMAR)", after, PREVIEW_LINES_MAIN, "afterBox", "Recommended")}
        ${detailsBlock("Δ (Diff)", delta, PREVIEW_LINES_DELTA, "deltaBox", "Key changes")}
      </div>
    `;
  }

  async function runLive(){
    if (!liveReady) {
      outEl.textContent = "Live not ready";
      return;
    }
    runLiveEl.disabled = true;
    liveHintEl.textContent = "Running...";
    outEl.textContent = "Running...";
    try {
      const w = withTimeout(30000);
      const r = await fetch(`${API_BASE}/api/triad`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ input: qEl.value || "" }),
        signal: w.signal,
      });
      if (!r.ok) {
        const body = await r.text();
        const short = body.length > 300 ? (body.slice(0, 300) + "...") : body;
        liveHintEl.textContent = `Live error: HTTP ${r.status}`;
        outEl.textContent = `Live error: HTTP ${r.status}\n\n${short}`;
        return;
      }
      const data = await r.json();
      if (data && data.ok === false) {
        const detail = JSON.stringify(data);
        const short = detail.length > 300 ? (detail.slice(0, 300) + "...") : detail;
        liveHintEl.textContent = `Live error: ${data.error || "unknown"}`;
        outEl.textContent = `Live error\n\n${short}`;
        return;
      }
      const ok = data && ["compare", "expand", "diff", "merge"].every(k => typeof data[k] === "string");
      if (!ok) throw new Error("invalid response shape");
      liveData = data;
      liveHintEl.textContent = "Live ready";
      liveLastRunEl.textContent = `Last run: ${new Date().toISOString()}`;
      setTimestamp();
      loadActive();
    } catch (e) {
      liveHintEl.textContent = `Live error: ${e}`;
      outEl.textContent = `Live run failed\n\n${e}`;
    } finally {
      renderMode();
    }
  }

  async function loadActive(){
    const spec = TAB_SPEC.find(x => x.key === active);
    outEl.textContent = "Loading…";
    if (mode === "live"){
      if (!liveData){
        outEl.textContent = liveReady ? "Live mode: press Run" : "Live not ready";
        return;
      }
      const txt = liveData[active] || "";
      if (active === "compare") {
        renderCompare(txt);
      } else {
        outEl.innerHTML = `<pre class="subpre">${escapeHtml(txt.trim() ? txt : "(empty)")}</pre>`;
      }
      return;
    }
    try{
      const txt = await fetchText(spec.file);
      setTimestamp();

      if (active === "compare"){
        renderCompare(txt);
      } else {
        outEl.innerHTML = `<pre class="subpre">${escapeHtml(txt.trim() ? txt : "(empty)")}</pre>`;
      }
    } catch(e){
      outEl.textContent = `Failed to load ${spec.file}\n\n${e}`;
    }
  }

  modeStaticEl.onclick = () => { mode = "static"; renderMode(); loadActive(); };
  modeLiveEl.onclick = async () => { mode = "live"; renderMode(); await checkLiveHealth(); loadActive(); };
  runLiveEl.onclick = runLive;
  document.getElementById("reload").onclick = loadActive;
  renderMode();
  renderTabs();
  loadActive();
</script>
</body>
</html>
