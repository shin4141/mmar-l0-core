<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      let storedLang = "";
      try {
        storedLang = String(window.localStorage.getItem("mmar_lang") || "").trim().toLowerCase();
      } catch {}
      const lang = String(params.get("lang") || storedLang || "").trim().toLowerCase() === "en" ? "en" : "ja";
      window.__MMAR_INITIAL_LANG = lang;
      try {
        window.localStorage.setItem("mmar_lang", lang);
      } catch {}
      document.documentElement.lang = lang;
      if (lang === "en") document.documentElement.setAttribute("data-first-paint-pending", "1");
    })();
  </script>
  <style>
    html[data-first-paint-pending="1"] body { visibility: hidden; }
  </style>
  <title>VerdAIct | AI Battle Gallery</title>
  <link rel="stylesheet" href="./gallery.css?v=20260409a" />
</head>
<body>
  <main class="gallery-shell">
    <header class="gallery-hero">
      <div class="gallery-copy">
        <div class="gallery-eyebrow">VerdAIct</div>
        <h1 id="gallery-title">VerdAIct</h1>
        <p id="gallery-copy">気になるAIバトルを選ぶ</p>
      </div>
      <div class="gallery-actions">
        <a id="gallery-create-link" class="gallery-link" href="./debate.html?mode=battle&focus=x_url">バトルを作る</a>
      </div>
    </header>
    <script>
      (function () {
        if (window.__MMAR_INITIAL_LANG !== "en") return;
        document.title = "VerdAIct | AI Battle Gallery";
        const titleEl = document.getElementById("gallery-title");
        const copyEl = document.getElementById("gallery-copy");
        const createEl = document.getElementById("gallery-create-link");
        if (titleEl) titleEl.textContent = "VerdAIct";
        if (copyEl) copyEl.textContent = "Pick an AI battle that grabs you";
        if (createEl) {
          createEl.textContent = "Create a battle";
          createEl.href = "./debate.html?mode=battle&focus=x_url&lang=en";
        }
        document.documentElement.removeAttribute("data-first-paint-pending");
      })();
    </script>

    <section class="gallery-toolbar">
      <div class="gallery-toolbar-copy">
        <span id="gallery-count" class="gallery-count">0 cards</span>
      </div>
    </section>

    <section id="gallery-grid" class="gallery-grid" aria-live="polite">
      <div class="gallery-empty">AIバトルを読み込み中です。</div>
    </section>
  </main>

  <script type="module" src="./gallery.js?v=20260409a"></script>
</body>
</html>
