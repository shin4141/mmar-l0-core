<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MMAR Debate Preview</title>
  <link rel="stylesheet" href="./debate_v4_preview.css?v=20260401a" />
</head>
<body>
  <main class="preview-shell">
    <header class="preview-head">
      <p class="eyebrow">MMAR Debate Preview</p>
      <h1>Curated Live Preview</h1>
      <p class="lede">A/B の3ターン討論をそのまま表示する curated preview。</p>
    </header>

    <section class="topic-card" aria-label="Fixed topic">
      <div class="label">Fixed Topic</div>
      <p id="topic-text" class="topic-text">本日SORAが撤退というニュースが出てきたけど。GPTは動画サービスに手を出すべきでなかった。</p>
    </section>

    <section class="action-row" aria-label="Run actions">
      <button id="run-button" class="primary-button" type="button">Run Debate</button>
      <button id="copy-button" class="secondary-button" type="button" disabled>Copy Debate</button>
    </section>

    <section class="status-row" aria-live="polite">
      <span id="status" class="status">Ready</span>
      <span id="error" class="error" hidden>Preview failed.</span>
    </section>

    <section id="output" class="output-grid empty" aria-label="Debate output">
      <div class="empty-state">Run Debate を押すと、Turn1 から Turn3 まで表示します。</div>
    </section>

    <footer class="preview-foot">
      experimental preview
    </footer>
  </main>

  <script src="./debate_v4_preview.js?v=20260401a" defer></script>
</body>
</html>
