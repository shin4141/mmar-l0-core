<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VerdAIct Admin</title>
  <link rel="stylesheet" href="/admin/admin.css?v=20260418c" />
</head>
<body>
  <main class="admin-shell admin-history-shell">
    <section class="admin-card admin-list-card">
      <div class="admin-toolbar">
        <div>
          <div class="admin-eyebrow">VerdAIct Admin</div>
          <h1>Candidate / Published</h1>
        </div>
        <div class="admin-toolbar-actions">
          <a href="/admin/data" class="admin-toolbar-link">Data</a>
          <button id="admin-refresh" type="button" class="secondary-button">Refresh</button>
          <button id="admin-logout" type="button" class="secondary-button">Logout</button>
        </div>
      </div>
      <div class="admin-filter-row" role="tablist" aria-label="Run state filters">
        <button id="admin-filter-all" type="button" class="secondary-button admin-filter-button is-active" data-state-filter="all">All</button>
        <button id="admin-filter-candidate" type="button" class="secondary-button admin-filter-button" data-state-filter="candidate">Candidate</button>
        <button id="admin-filter-failed" type="button" class="secondary-button admin-filter-button" data-state-filter="failed">Failed</button>
        <button id="admin-filter-published" type="button" class="secondary-button admin-filter-button" data-state-filter="published">Published</button>
        <button id="admin-filter-trash" type="button" class="secondary-button admin-filter-button" data-state-filter="trash">Trash</button>
      </div>
      <div id="admin-run-list" class="admin-run-list empty">
        <div class="empty-state">Loading runs...</div>
      </div>
    </section>
    <section class="admin-card admin-detail-card">
      <div class="admin-detail-head">
        <div class="admin-detail-title-row">
          <h2>Run Detail</h2>
          <span id="admin-detail-mode-badge" class="admin-badge admin-mode-badge admin-mode-badge-debate" hidden>討論</span>
          <span id="admin-detail-state-badge" class="admin-badge admin-state-badge" hidden>Candidate</span>
        </div>
        <div class="admin-toolbar-actions">
          <button id="admin-promote" type="button" disabled>Publish</button>
          <button id="admin-remove" type="button" class="secondary-button" disabled>Move to Candidate</button>
          <button id="admin-archive" type="button" class="secondary-button" disabled>Archive</button>
          <button id="admin-delete" type="button" class="danger-button" disabled>Delete</button>
          <button id="admin-restore" type="button" class="secondary-button" disabled>Restore</button>
        </div>
      </div>
      <div id="admin-action-note" class="admin-action-note"></div>
      <section id="admin-x-card-panel" class="admin-x-card-panel" hidden>
        <div class="admin-x-card-head">
          <div>
            <div class="admin-section-title">X Card Preview</div>
            <div id="admin-x-card-url" class="admin-meta"></div>
          </div>
          <button id="admin-x-card-fetch" type="button" class="secondary-button" hidden>Xカード取得</button>
        </div>
        <div id="admin-x-card-status" class="admin-meta">未取得</div>
        <div id="admin-x-card-preview" class="admin-x-card-preview"></div>
      </section>
      <div id="admin-detail-meta" class="admin-meta">Select a run.</div>
      <div id="admin-detail-json" class="admin-detail-body">Select a run.</div>
      <div id="admin-history-status" class="admin-status" hidden></div>
    </section>
  </main>
  <script type="module" src="/admin/admin_history.js?v=20260418c"></script>
</body>
</html>
