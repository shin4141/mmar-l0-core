<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MMAR Admin Login</title>
  <link rel="stylesheet" href="/admin/admin.css?v=20260402a" />
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card admin-login-card">
      <div class="admin-eyebrow">MMAR Admin</div>
      <h1>Shin Login</h1>
      <p class="admin-copy">History に採用する run を選ぶための最小管理入口です。</p>
      <form id="admin-login-form" class="admin-form">
        <label class="admin-field">
          <span>Password</span>
          <input id="admin-password" type="password" autocomplete="current-password" />
        </label>
        <button id="admin-login-button" type="submit">Login</button>
      </form>
      <div id="admin-login-status" class="admin-status" hidden></div>
    </section>
  </main>
  <script type="module" src="/admin/admin_login.js?v=20260402a"></script>
</body>
</html>
